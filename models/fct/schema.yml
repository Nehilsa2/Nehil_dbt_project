models:
 
  - name: fct_hosts_micro
 
    description: "Fact table containing host records loaded incrementally using the microbatch strategy."

    columns:
 
      - name: host_id
 
        description: "Unique identifier for the host."
 
        tests:
 
          - unique
 
          - not_null

      - name: host_name
 
        description: "Name of the host."
 
        tests:
 
          - not_null

      - name: is_superhost
 
        description: "Indicates whether the host is a superhost."
 
        tests:
 
          - not_null
 
          - accepted_values:
              arguments:
                values: [true, false]

      - name: created_at
 
        description: "Timestamp when the host record was created."
 
        tests:
 
          - not_null

      - name: updated_at
 
        description: "Timestamp when the host record was last updated."


