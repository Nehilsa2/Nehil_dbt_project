models:

  - name: dim_hosts_cleansed

    description: "{{ doc('model3') }}"

    tests:

      - minimum_row_count:

          min_row_count: 100

    columns:

      - name: host_id

        description: "This is Host id"

        tests:
 
          - unique

          - not_null

          - relationships:

              arguments:

                to: ref('src_hosts')

                field: host_id

      - name: host_name

        description: "This is Host name"

        tests:

          - not_null

      - name: is_superhost

        description: "This is superhost status"

        tests:

          - not_null

          - accepted_values:

              arguments:

                values: [true, false]

                quote: false

      - name: created_at

        tests:

          - not_null

      - name: updated_at

        tests:

          - not_null

  - name: dim_listing_cleansed

    description: "This model joins listing and host data to provide listing details along with host information."

    columns:

      - name: listing_id

        description: "Unique identifier of the listing."

        tests:

          - unique

          - not_null

      - name: listing_name

        description: "Name of the listing."

        tests:

          - not_null

      - name: room_type

        description: "Type of room offered in the listing."

        tests:

          - not_null

      - name: price_str

        description: "Price of the listing stored as a string."

      - name: minimum_nights

        description: "Minimum number of nights required for booking."

        tests:

          - not_null

      - name: host_id

        description: "Host identifier associated with the listing."

        tests:

          - not_null

          - relationships:

              arguments:

                to: ref('dim_hosts_cleansed')

                field: host_id


      - name: created_at

        description: "Timestamp when the listing record was created."

        tests:

          - not_null

      - name: updated_at

        description: "Latest timestamp from either listing or host record."

        tests:

          - not_null

  - name: dim_listing_w_hosts

    description: "This model joins listing and host data to provide listing details along with host information."

    columns:

      - name: host_id

        description: "Unique identifier for the host."

        tests:

          - unique

          - not_null

          - relationships:

              arguments:

                to: ref('src_hosts')

                field: host_id

      - name: host_name

        description: "Host name. Null values are replaced with 'Anonymous'."

        tests:

          - not_null

      - name: is_superhost

        description: "Indicates whether the host is a superhost."

        tests:

          - not_null

          - accepted_values:

              arguments:

                values: [true, false]

                quote: false

      - name: created_at

        description: "Timestamp when the host record was created."

        tests:

          - not_null

      - name: updated_at

        description: "Timestamp when the host record was last updated."

        tests:

          - not_null
 